function parseCSV(t){t=t.replace(/^\uFEFF/,"");const rows=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
 if(c!==""||r.length){r.push(c);rows.push(r)}
 return rows.filter(x=>x.some(v=>v.trim()))}
async function fetchText(url){
 const ac=new AbortController(),id=setTimeout(()=>ac.abort(),12000);
 try{const r=await fetch(url,{cache:"no-cache",signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(!t.trim()||/^\s*<(!doctype|html)/i.test(t))throw new Error("not csv");return t}

function fixImg(u){

 u=https(u);
 const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/i);
 if(d)return`https://drive.google.com/thumbnail?id=${d[1]}&sz=w1000`;
 try{return encodeURI(decodeURI(u))}catch{return u.replace(/\s/g,"%20")}}
const splitImgs=s=>String(s||"").split(/\s*(?:\n|\||;)\s*|,\s*(?=https?:\/\/|\/\/)/).map(fixImg).filter(Boolean);

    ${govs.map(g=>`<option value="${esc(g)}" ${g===selGov?"selected":""}>${esc(g)}</option>`).join("")}
   </select>
   <div style="font-size:12px;color:var(--mut);margin-top:3px" id="shipDesc">${selGov&&gRow?(sCost===0?esc(T("shipFree")):`${esc(T("shipCost",money(sCost)))} (${esc(T("delivery",gRow.days))})`):esc(T("govAsk"))}</div>
  </div>
  <input class="in" id="cName" placeholder="${esc(T("name"))}" value="${esc(ls.get("alora_name",""))}">
  <input class="in" id="cPhone" type="tel" placeholder="${esc(T("phone"))}" value="${esc(ls.get("alora_phone",""))}">
  <textarea class="in" id="cAddr" placeholder="${esc(T("addr"))}" style="height:60px;resize:none">${esc(ls.get("alora_addr",""))}</textarea>
  <div class="err" id="cErr"></div>
  <button class="big dark" id="cSend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>${esc(T("send"))}</button>
 `;
}

/* ===== PRODUCT MODAL ===== */
function openModal(id){
 const p=byId(id);if(!p)return;
 curId=id; curSize="";
 const box=$("#mIn");
 box.innerHTML=`
 <div class="pm">
  <div>
   <div class="gal">${p.imgs.map(u=>img(u,800)).join("")}</div>
   <div class="th">${p.imgs.map((u,i)=>`<button class="${i===0?"on":""}" data-th="${i}">${img(u,100)}</button>`).join("")}</div>
  </div>
  <div class="pi">
   <h2>${esc(p.name)}</h2>
   <div class="price" style="font-size:17px"><b>${money(eff(p))}</b>${p.sale?`<s>${money(p.price)}</s>`:""}</div>
   <p>${esc(p.desc||"")}</p>
   <div style="font-size:12.5px;color:var(--mut)">${esc(T("mCode"))}: <b>${esc(p.id)}</b></div>
   ${p.sizes&&p.sizes.length?`
    <div>
     <div class="szt">${esc(T("pickSize"))}:</div>
     <div class="sizes" style="margin-top:6px">
      ${p.sizes.map(s=>`<button class="chip" data-size="${esc(s)}">${esc(s)}</button>`).join("")}
     </div>
     <div class="szerr" id="szErr"></div>
    </div>`:""}
   <div style="display:flex;gap:10px;margin-top:auto">
    <button class="big dark" id="mAdd" ${p.out?"disabled":""}>${p.out?esc(T("out")):esc(T("add"))}</button>
    <a class="big soft" id="mWa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 20.5l1.2-4A8.5 8.5 0 1 1 8 19.3z"/><path fill="currentColor" stroke="none" d="M9 9.5c0 2.8 2.7 5.5 5.5 5.5l1-1.4-1.9-.9-.8.8a4.6 4.6 0 0 1-2.2-2.2l.8-.8-.9-1.9-1.5.9Z"/></svg></a>
   </div>
  </div>
 </div>`;
 
 const waNum=sv("Store_Phone_WhatsApp","WhatsApp","Phone")||CFG.WA;
 const cleanWa=waNum.replace(/\D/g,"");
 const waText=encodeURIComponent(`${T("mAsk")}: ${p.name} (${p.id})`);
 $("#mWa").href=`https://wa.me/${cleanWa}?text=${waText}`;
 
 $("#modal").classList.add("on");$("#ov").classList.add("on");
 track("ViewContent",p);
}
function closeModal(){$("#modal").classList.remove("on");if(!$("#cart").classList.contains("on"))$("#ov").classList.remove("on")}

/* ===== INIT & EVENTS ===== */
async function init(){
 try{
  const [sText,pText,shText]=await Promise.all([
   fetchText(CFG.SETTINGS).catch(()=>""),
   fetchText(CFG.PRODUCTS).catch(()=>""),
   fetchText(CFG.SHIP).catch(()=>"")
  ]);
  if(sText)S=buildSettings(parseCSV(sText));
  if(pText)P=buildProducts(parseCSV(pText));
  if(shText)SHIP=parseShip(shText);
 }catch(e){console.error(e)}
 
 if(!P.length){
  P=[
   {id:"AL001",nameAr:"شنطة هاندمايد كلاسيك",nameEn:"Classic Handmade Bag",cat:"شنط",best:true,price:850,sale:750,imgs:[PH],sizes:[],descAr:"شنطة بتصميم أنيق وهادئ.",descEn:"Bag with elegant calm design."},
   {id:"AL002",nameAr:"خاتم فضة إيطالي مرصع",nameEn:"Italian Silver Ring",cat:"خواتم",best:true,price:450,sale:0,imgs:[PH],sizes:["6","7","8","9"],descAr:"خاتم فضة عيار 925 بتصميم راقي.",descEn:"Sterling silver 925 ring."},
   {id:"AL003",nameAr:"حلق ديزاين ترندي",nameEn:"Trendy Earrings",cat:"حلقان",best:false,price:320,sale:280,imgs:[PH],sizes:[],descAr:"حلق أنيق يناسب كل المناسبات.",descEn:"Elegant earrings for all occasions."},
   {id:"AL004",nameAr:"طقم لؤلؤ",nameEn:"Pearl Set",cat:"أطقم",best:true,price:1200,sale:999,imgs:[PH],sizes:[],descAr:"طقم متكامل يعكس أناقتك.",descEn:"Complete set."}
  ];
 }
 
 document.documentElement.lang=LANG;
 document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
 $("#langBtn").textContent=LANG==="ar"?"EN":"AR";
 
 const hT=sv("Hero_Title","HeroTitle")||T("heroH");
 const hS=sv("Hero_Subtitle","HeroSubtitle")||T("heroP");
 const ann=sv("Announcement_Text","AnnouncementText")||"";
 
 $("#heroT").textContent=hT;
 $("#heroS").textContent=hS;
 $("#heroBtn").textContent=T("shopNow");
 $("#tBest").textContent=T("best");
 $("#tSwipe").textContent=T("swipe");
 $("#tCols").textContent=T("cols");
 $("#tInfo").textContent=T("info");
 $("#tContact").textContent=T("contact");
 $("#tCart").textContent=T("cart");
 $("#q").placeholder=T("search");
 $("#brandP").textContent=T("brandP");
 $("#aboutLink").textContent=T("about");
 $("#lShip").textContent=T("pShip");
 $("#lPriv").textContent=T("pPriv");
 $("#lRet").textContent=T("pRet");
 
 if(ann){const an=$("#ann");an.textContent=ann;an.removeAttribute("hidden")}
 
 const waNum=sv("Store_Phone_WhatsApp","WhatsApp","Phone")||CFG.WA;
 if(waNum){const wa=$("#waFab");wa.href=`https://wa.me/${waNum.replace(/\D/g,"")}`;wa.removeAttribute("hidden")}
 
 const socBox=$("#soc");
 const sMap=[{k:"facebookurl",i:I.fb},{k:"instagramurl",i:I.ig},{k:"tiktokurl",i:I.tt},{k:"storeemail",i:I.mail,pre:"mailto:"}];
 socBox.innerHTML=sMap.map(x=>{
  const val=S[x.k];if(!val)return"";
  return`<a href="${x.pre||""}${val}" target="_blank" rel="noopener">${x.i}</a>`
 }).join("");
 
 $("#copyLine").innerHTML=`&copy; 2026 ${esc(CFG.STORE)}. ${T("rights")}`;
 
 renderNav();
 renderCols();
 renderReels();
 renderGrid();
 updateCounts();
}

/* Event listeners */
document.addEventListener("click",e=>{
 const t=e.target;
 
 if(t.closest("#langBtn")){
  LANG=LANG==="ar"?"en":"ar";
  ls.set("alora_lang",LANG);
  init(); return;
 }
 
 if(t.closest("#cartBtn"))openCart();
 if(t.closest("#wishBtn")){
  wishOnly=!wishOnly;
  renderNav(); renderGrid();
  if(wishOnly)$("#shop").scrollIntoView({behavior:"smooth"});
  return;
 }
 if(t.closest("[data-close]")){closeCart();closeModal();return;}
 if(t.target.id==="ov"){closeCart();closeModal();return;}
 
 const chip=t.closest("[data-cat]");
 if(chip){
  cat=chip.getAttribute("data-cat");
  wishOnly=false; collRe=null;
  renderNav(); renderGrid();
  $("#shop").scrollIntoView({behavior:"smooth"});
  return;
 }
 
 const fav=t.closest("[data-fav]");
 if(fav){
  const id=fav.getAttribute("data-fav");
  if(wish.includes(id)){
   wish=wish.filter(x=>x!==id);
   showToast(T("toastRm"));
  }else{
   wish.push(id);
   showToast(T("toastWish"));
   track("Lead",{id});
  }
  ls.set("alora_wish",wish);
  updateCounts(); renderGrid();
  return;
 }
 
 const add=t.closest("[data-add]");
 if(add){
  const id=add.getAttribute("data-add");
  const p=byId(id);if(!p||p.out)return;
  const isRing = /ring|خاتم|خواتم/i.test(p.cat);
  if(isRing && p.sizes && p.sizes.length && !curSize){
   openModal(id);
   return;
  }
  const item=cart.find(i=>i.id===id&&i.size===curSize);
  if(item)item.qty++;else cart.push({id,qty:1,size:curSize});
  ls.set("alora_cart",cart);
  updateCounts(); showToast(T("toastAdd"));
  track("AddToCart",p);
  closeModal();
  return;
 }
 
 const openCard=t.closest("[data-open]")||t.closest(".card [data-id]")||t.closest(".reel");
 if(openCard && !t.closest("button") && !t.closest(".fav")){
  const id=openCard.getAttribute("data-id")||openCard.closest("[data-id]")?.getAttribute("data-id");
  if(id)openModal(id);
  return;
 }
 
 const col=t.closest("[data-col-re]");
 if(col){
  const reStr=col.getAttribute("data-col-re");
  collRe=new RegExp(reStr.replace(/^\/|\/[gimuy]*$/g,""),"i");
  cat=ALL; wishOnly=false;
  renderNav(); renderGrid();
  $("#shop").scrollIntoView({behavior:"smooth"});
  return;
 }
 
 const th=t.closest("[data-th]");
 if(th){
  const idx=parseInt(th.getAttribute("data-th"),10);
  const gal=th.closest(".pm").querySelector(".gal");
  gal.scrollTo({left:idx*gal.clientWidth,behavior:"smooth"});
  th.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  th.classList.add("on");
  return;
 }
 
 const szBtn=t.closest("[data-size]");
 if(szBtn){
  szBtn.parentElement.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  szBtn.classList.add("on");
  curSize=szBtn.getAttribute("data-size");
  const err=$("#szErr");if(err)err.textContent="";
  return;
 }
 
 const qInc=t.closest("[data-qty-inc]");
 if(qInc){const idx=parseInt(qInc.getAttribute("data-qty-inc"),10);cart[idx].qty++;ls.set("alora_cart",cart);updateCounts();renderCart();return;}
 const qDec=t.closest("[data-qty-dec]");
 if(qDec){const idx=parseInt(qDec.getAttribute("data-qty-dec"),10);cart[idx].qty--;if(cart[idx].qty<=0)cart.splice(idx,1);ls.set("alora_cart",cart);updateCounts();renderCart();return;}
 const qRm=t.closest("[data-cart-rm]");
 if(qRm){const idx=parseInt(qRm.getAttribute("data-cart-rm"),10);cart.splice(idx,1);ls.set("alora_cart",cart);updateCounts();renderCart();return;}
 
 if(t.closest("#cSend")){
  const name=$("#cName")?.value.trim()||"";
  const phone=$("#cPhone")?.value.trim()||"";
  const addr=$("#cAddr")?.value.trim()||"";
  const gov=$("#cGov")?.value.trim()||"";
  const err=$("#cErr");
  
  if(!name || name.split(/\s+/).length<2){if(err)err.textContent=T("eName");return}
  if(!/^01[0125]\d{8}$/.test(phone)){if(err)err.textContent=T("ePhone");return}
  if(!gov){if(err)err.textContent=T("eGov");return}
  if(!addr || addr.length<5){if(err)err.textContent=T("eAddr");return}
  
  ls.set("alora_name",name); ls.set("alora_phone",phone); ls.set("alora_addr",addr); ls.set("alora_gov",gov);
  
  const sub=cart.reduce((s,i)=>s+eff(byId(i.id))*i.qty,0);
  const gRow=govRow(gov);
  const sCost=shipFor(gRow,sub);
  const grand=(sCost!==null)?sub+sCost:sub;
  
  let txt=`🛍️ *${T("mNew")}*\n\n`+
          `👤 *${T("mName")}:* ${name}\n`+
          `📱 *${T("mPhone")}:* ${phone}\n`+
          `📍 *${T("mGov")}:* ${gov}\n`+
          `🏠 *${T("mAddr")}:* ${addr}\n\n`+
          `📦 *${T("mItems")}:*\n`;
  
  cart.forEach((i,idx)=>{
   const p=byId(i.id);
   txt+=`${idx+1}. ${p?p.name:i.id} ${i.size?`(${T("mSize")}: ${i.size})`:""} × ${i.qty} = ${money(eff(p)*i.qty)}\n`;
  });
  
  txt+=`\n💰 *${T("mTotal")}:* ${money(sub)}\n`;
  txt+=`🚚 *${T("mShip")}:* ${sCost!==null?(sCost===0?T("mFree"):money(sCost)):T("mTbd")}\n`;
  if(gRow)txt+=`⏱️ *${T("mDelivery")}:* ${gRow.days} ${LANG==="ar"?"أيام عمل":"business days"}\n`;
  txt+=`✨ *${T("mGrand")}:* ${money(grand)}`;
  
  const waNum=sv("Store_Phone_WhatsApp","WhatsApp","Phone")||CFG.WA;
  if(!waNum){if(err)err.textContent=T("eWa");return}
  
  track("Purchase",{value:grand,ids:cart.map(i=>i.id)});
  window.open(`https://wa.me/${waNum.replace(/\D/g,"")}?text=${encodeURIComponent(txt)}`,"_blank");
  return;
 });
});

document.addEventListener("input",e=>{
 if(e.target.id==="q"){
  term=e.target.value.trim();
  renderGrid();
 }
});

document.addEventListener("change",e=>{
 if(e.target.id==="cGov"){
  const gov=e.target.value;
  ls.set("alora_gov",gov);
  renderCart();
 }
});

window.addEventListener("DOMContentLoaded",init);
</script>
