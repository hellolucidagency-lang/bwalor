/* ===== N8N DATA LOADER ===== */
async function loadStoreDataFromN8N(){
 try{
  const res = await fetch(N8N_GET_URL);
  if(!res.ok) throw new Error("Network response was not ok");
  const data = await res.json();
  
  P = data.products || [];
  S = data.settings || {};
  SHIP = data.shipping || [];
  
  ls.set("alora_cached_products", P);
  ls.set("alora_cached_settings", S);
  ls.set("alora_cached_shipping", SHIP);
 }catch(e){
  console.warn("Falling back to cache", e);
  P = ls.get("alora_cached_products", []);
  S = ls.get("alora_cached_settings", {});
  SHIP = ls.get("alora_cached_shipping", []);
 }
 renderAll();
}

function fixImg(u){
 u=String(u||"").trim().replace(/^["'\s]+|["'\s]+$/g,"");if(!u)return"";
 if(u.startsWith("//"))u="https:"+u;
 if(!/^https?:\/\//i.test(u))return"";
 u=https(u);
 const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/i);
 if(d)return`https://drive.google.com/thumbnail?id=${d[1]}&sz=w1000`;
 try{return encodeURI(decodeURI(u))}catch{return u.replace(/\s/g,"%20")}}
const splitImgs=s=>String(s||"").split(/\s*(?:\n|\||;)\s*|,\s*(?=https?:\/\/|\/\/)/).map(fixImg).filter(Boolean);

/* ===== DIRECT ADD & SIZE SELECTION ===== */
function handleAddToCartDirect(productId) {
  const product = byId(productId);
  if (!product) return;

  // فحص الخواتم أو المنتجات ذات المقاس
  if (product.cat.toLowerCase().includes('ring') || product.cat.includes('خاتم') || (product.sizes && product.sizes.length > 0)) {
    openModal(productId);
  } else {
    addToCart(productId, null);
  }
}

/* ===== SAVE ORDER VIA N8N ===== */
async function submitOrderToN8N(orderPayload) {
  try {
    const response = await fetch(N8N_POST_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-TOKEN': API_TOKEN
      },
      body: JSON.stringify(orderPayload)
    });
    if(!response.ok) throw new Error("Failed to save order");
    return await response.json();
  } catch(err) {
    console.error("Order submit error:", err);
    throw err;
  }
}

function addToCart(id, sz){
 const p=byId(id);if(!p||p.out)return;
 const item=cart.find(x=>x.id===id&&x.sz===(sz||""));
 if(item)item.qty++;else cart.push({id,sz:sz||"",qty:1});
 ls.set("alora_cart",cart);updateCounts();toast(T("toastAdd"));
}

 updateCounts();

function updateCounts(){
 $("#cc").textContent=cart.reduce((a,b)=>a+b.qty,0);

 const t=$("#toast");t.textContent=msg;t.classList.add("on");
