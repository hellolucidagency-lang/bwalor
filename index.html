<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black & White Alora</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            luxuryGold: '#D4AF37',
            luxuryBlack: '#111111',
            luxuryBg: '#FAF9F6'
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Tajawal', sans-serif; background-color: #FAF9F6; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-gray-800 antialiased selection:bg-luxuryGold selection:text-white pb-20">

  <!-- Announcement Bar -->
  <div id="announcementBar" class="bg-luxuryBlack text-white text-xs py-2 text-center font-medium tracking-wide">
    ✦ تشكيلة جديدة وصلت | شحن سريع لجميع المحافظات ✦
  </div>

  <!-- Navbar -->
  <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
      <!-- Icons Right -->
      <div class="flex items-center gap-3">
        <button onclick="toggleCartDrawer()" class="relative p-2 text-gray-700 hover:text-black">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span id="cartBadge" class="absolute top-0 right-0 bg-luxuryGold text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
        <button onclick="toggleWishlistDrawer()" class="relative p-2 text-gray-700 hover:text-black">
          <i class="fa-regular fa-heart text-xl"></i>
          <span id="wishlistBadge" class="absolute top-0 right-0 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
      </div>

      <!-- Search Bar Center -->
      <div class="flex-1 max-w-md">
        <div class="relative">
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحثي عن شنطة أو إكسسوار..." class="w-full bg-gray-100/80 border-0 rounded-full py-2 pr-10 pl-4 text-xs focus:ring-2 focus:ring-luxuryGold outline-none transition">
          <i class="fa-solid fa-magnifying-glass absolute top-2.5 right-3.5 text-gray-400 text-sm"></i>
        </div>
      </div>

      <!-- Logo Left -->
      <div class="flex items-center gap-2">
        <img id="siteLogoImg" src="" alt="Logo" class="h-8 w-auto hidden object-contain">
        <span class="font-extrabold text-base md:text-lg tracking-wider text-luxuryBlack uppercase">ALORA <span class="text-luxuryGold">BLACK & WHITE</span></span>
      </div>
    </div>
  </nav>

  <!-- Hero Section: Swipeable Reels / Best Sellers Carousel -->
  <section id="heroContainer" class="bg-gradient-to-b from-gray-50 to-transparent"></section>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 mt-4">
    <!-- Categories Tabs -->
    <div class="flex items-center justify-center gap-2 overflow-x-auto pb-4 hide-scrollbar" id="categoriesContainer">
      <button onclick="filterCategory('الكل')" class="cat-btn active bg-luxuryBlack text-white px-5 py-2 rounded-full text-xs font-bold transition shadow-sm">التشكيلة كاملة</button>
    </div>

    <!-- Products Grid -->
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 mt-6" id="productsGrid">
      <!-- Loading Skeleton -->
      <div class="col-span-full text-center py-16 text-gray-400 font-medium">جاري جلب تشكيلة Alora...</div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-20 border-t border-gray-200 bg-white py-10">
    <div class="max-w-7xl mx-auto px-4 text-center">
      <h3 class="font-bold text-luxuryBlack text-lg tracking-widest uppercase mb-2">BLACK & WHITE ALORA</h3>
      <p id="footerAbout" class="text-xs text-gray-500 max-w-md mx-auto mb-6">تشكيلة أوربية عصرية تناسب كل خروجة ومناسبة، بلمسات متقنة تدوم معاكي.</p>
      <div id="socialLinks" class="flex justify-center gap-4 text-gray-600 text-lg mb-6"></div>
      <p class="text-[11px] text-gray-400">جميع الحقوق محفوظة © 2026 Black & White Alora</p>
    </div>
  </footer>

  <!-- JavaScript Code -->
  <script>
    // الروابط مضبوطة بالتوزيع الصحيح تماماً حسب طلبك:
    const SETTINGS_CSV_URL = "https://corsproxy.io/?" + encodeURIComponent("https://docs.google.com/spreadsheets/d/e/2PACX-1vRsdI0z9kWcDZlyguHag37HCtz8buw96LEi7HJn5jcBNtdhesi4kVNfS7LubEIBhn8-v5Ai5uBzAHfU/pub?gid=0&single=true&output=csv");
    const PRODUCTS_CSV_URL = "https://corsproxy.io/?" + encodeURIComponent("https://docs.google.com/spreadsheets/d/e/2PACX-1vRsdI0z9kWcDZlyguHag37HCtz8buw96LEi7HJn5jcBNtdhesi4kVNfS7LubEIBhn8-v5Ai5uBzAHfU/pub?gid=2078282954&single=true&output=csv");

    let siteSettings = {};
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('bw_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('bw_wishlist')) || [];
    let activeCategory = 'الكل';

    function fixImageUrl(url) {
      if (!url) return 'https://via.placeholder.com/400x500?text=Black+%26+White+Alora';
      url = url.trim();
      if (url.includes('drive.google.com')) {
        let match = url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
        if (match && match[1]) {
          return `https://lh3.googleusercontent.com/d/${match[1]}`;
        }
      }
      return url;
    }

    function getProductImage(item) {
      let rawUrl = item.Main_Image || item.Image_URL || item.image_url || item.image || '';
      if (!rawUrl && item.Gallery_Images) {
        rawUrl = item.Gallery_Images;
      }
      if (!rawUrl) return 'https://via.placeholder.com/400x500?text=Black+%26+White+Alora';
      let firstUrl = rawUrl.split(',')[0].trim();
      return fixImageUrl(firstUrl);
    }

    function parseCSV(text) {
      let lines = [];
      let row = [''];
      let insideQuote = false;
      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let nextC = text[i+1];
        if (c === '"') {
          if (insideQuote && nextC === '"') { row[row.length - 1] += '"'; i++; }
          else { insideQuote = !insideQuote; }
        } else if (c === ',' && !insideQuote) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !insideQuote) {
          if (c === '\r' && nextC === '\n') { i++; }
          lines.push(row); row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') lines.push(row);
      return lines;
    }

    function csvToObjects(csvText) {
      let lines = parseCSV(csvText);
      if (lines.length < 2) return [];
      let headers = lines[0].map(h => h.trim());
      let result = [];
      for (let i = 1; i < lines.length; i++) {
        let obj = {};
        let currentLine = lines[i];
        for (let j = 0; j < headers.length; j++) {
          obj[headers[j]] = currentLine[j] !== undefined ? currentLine[j].trim() : '';
        }
        result.push(obj);
      }
      return result;
    }

    async function initApp() {
      try {
        let setRes = await fetch(SETTINGS_CSV_URL);
        if (setRes.ok) {
          let setTxt = await setRes.text();
          let setRows = csvToObjects(setTxt);
          if (setRows.length > 0) { siteSettings = setRows[0]; applySettings(); }
        }

        let prodRes = await fetch(PRODUCTS_CSV_URL);
        if (prodRes.ok) {
          let prodTxt = await prodRes.text();
          allProducts = csvToObjects(prodTxt).filter(p => p.Title || p.Name || p.title || p.name);
        }

        renderHeroCarousel();
        renderCategories();
        renderProducts(allProducts);
        updateCartBadge();
        updateWishlistBadge();
      } catch (err) {
        console.error("خطأ أثناء جلب الشيت:", err);
      }
    }

    function applySettings() {
      if (siteSettings.Announcement_Text) {
        document.getElementById('announcementBar').innerText = siteSettings.Announcement_Text;
      }
      let logoUrl = siteSettings.Logo_URL || siteSettings.Main_Image;
      if (logoUrl) {
        let logoImg = document.getElementById('siteLogoImg');
        if (logoImg) {
          logoImg.src = fixImageUrl(logoUrl);
          logoImg.classList.remove('hidden');
        }
      }
      if (siteSettings.About_Us_Text) {
        document.getElementById('footerAbout').innerText = siteSettings.About_Us_Text;
      }

      let socialHtml = '';
      if (siteSettings.Instagram_URL) socialHtml += `<a href="${siteSettings.Instagram_URL}" target="_blank" class="hover:text-luxuryGold"><i class="fa-brands fa-instagram"></i></a>`;
      if (siteSettings.Facebook_URL) socialHtml += `<a href="${siteSettings.Facebook_URL}" target="_blank" class="hover:text-luxuryGold"><i class="fa-brands fa-facebook"></i></a>`;
      if (siteSettings.TikTok_URL) socialHtml += `<a href="${siteSettings.TikTok_URL}" target="_blank" class="hover:text-luxuryGold"><i class="fa-brands fa-tiktok"></i></a>`;
      document.getElementById('socialLinks').innerHTML = socialHtml;
    }

    function renderHeroCarousel() {
      const heroContainer = document.getElementById('heroContainer');
      if (!heroContainer) return;

      let featured = allProducts.slice(0, 6);
      if (featured.length === 0) return;

      let cardsHTML = featured.map(item => {
        let imgSrc = getProductImage(item);
        let title = item.Title || item.Name;
        return `
        <div class="min-w-[80%] md:min-w-[40%] lg:min-w-[28%] bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex-shrink-0 snap-center transition-all hover:shadow-md">
          <div class="relative h-60 rounded-xl overflow-hidden mb-3 bg-gray-50">
            <img src="${imgSrc}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x500?text=Alora';" />
            <span class="absolute top-2 right-2 bg-black/70 text-white text-[10px] px-2.5 py-1 rounded-full backdrop-blur-sm font-medium">✦ الأكثر طلباً</span>
          </div>
          <h4 class="font-bold text-gray-900 text-sm mb-1 truncate">${title}</h4>
          <p class="text-luxuryGold font-extrabold text-sm mb-3">${item.Price} ج.م</p>
          <button onclick="addToCart('${title}', '${item.Price}', '${imgSrc}')" class="w-full py-2 bg-luxuryBlack text-white text-xs rounded-xl hover:bg-black transition font-medium">أضف للسلة 🛒</button>
        </div>
      `}).join('');

      heroContainer.innerHTML = `
        <div class="max-w-7xl mx-auto px-4 py-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">🔥 الأكثر مبيعاً <span class="text-xs font-normal text-gray-400">(اسحبي لرؤية المزيد)</span></h3>
          </div>
          <div class="flex gap-4 overflow-x-auto pb-4 snap-x snap-mandatory hide-scrollbar scroll-smooth">
            ${cardsHTML}
          </div>
        </div>
      `;
    }

    function renderCategories() {
      const container = document.getElementById('categoriesContainer');
      let categories = ['الكل', ...new Set(allProducts.map(p => p.Category).filter(Boolean))];
      container.innerHTML = categories.map(cat => `
        <button onclick="filterCategory('${cat}')" class="cat-btn ${cat === activeCategory ? 'bg-luxuryBlack text-white' : 'bg-white text-gray-600 border border-gray-200'} px-5 py-2 rounded-full text-xs font-bold transition shadow-sm whitespace-nowrap">${cat}</button>
      `).join('');
    }

    function filterCategory(cat) {
      activeCategory = cat;
      renderCategories();
      let filtered = cat === 'الكل' ? allProducts : allProducts.filter(p => p.Category === cat);
      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;

      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">لا توجد منتجات مطابقة حالياً.</div>`;
        return;
      }

      grid.innerHTML = products.map(item => {
        let title = item.Title || item.Name;
        let isWish = wishlist.some(w => w.Title === title);
        let imgSrc = getProductImage(item);
        return `
          <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition group">
            <div class="relative h-72 bg-gray-50 overflow-hidden">
              <img src="${imgSrc}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x500?text=Alora';" />
              <button onclick="toggleWishlist('${title}', '${item.Price}', '${imgSrc}')" class="absolute top-3 left-3 w-9 h-9 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-gray-600 hover:text-red-500 transition">
                <i class="${isWish ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart"></i>
              </button>
            </div>
            <div class="p-4">
              <span class="text-[11px] text-gray-400 font-medium">${item.Category || 'عام'}</span>
              <h4 class="font-bold text-gray-800 text-sm mb-1 truncate">${title}</h4>
              <div class="flex items-center justify-between mt-3">
                <span class="text-luxuryBlack font-extrabold text-base">${item.Price} <span class="text-xs font-normal">ج.م</span></span>
                <button onclick="addToCart('${title}', '${item.Price}', '${imgSrc}')" class="w-9 h-9 rounded-xl bg-luxuryGold text-white flex items-center justify-center hover:opacity-90 transition">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function addToCart(title, price, image) {
      let existing = cart.find(c => c.Title === title);
      if (existing) { existing.qty++; }
      else { cart.push({ Title: title, Price: price, Image: image, qty: 1 }); }
      localStorage.setItem('bw_cart', JSON.stringify(cart));
      updateCartBadge();
      alert('تمت إضافة ' + title + ' إلى السلة ✨');
    }

    function toggleWishlist(title, price, image) {
      let idx = wishlist.findIndex(w => w.Title === title);
      if (idx > -1) { wishlist.splice(idx, 1); }
      else { wishlist.push({ Title: title, Price: price, Image: image }); }
      localStorage.setItem('bw_wishlist', JSON.stringify(wishlist));
      updateWishlistBadge();
      renderProducts(activeCategory === 'الكل' ? allProducts : allProducts.filter(p => p.Category === activeCategory));
    }

    function updateCartBadge() {
      let total = cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cartBadge').innerText = total;
    }

    function updateWishlistBadge() {
      document.getElementById('wishlistBadge').innerText = wishlist.length;
    }

    function handleSearch() {
      let q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = allProducts.filter(p => (p.Title || p.Name || '').toLowerCase().includes(q));
      renderProducts(filtered);
    }

    window.onload = initApp;
  </script>
</body>
</html>
