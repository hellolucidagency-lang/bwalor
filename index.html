/* ===== CSV PARSER ===== */
function parseCSV(t){t=t.replace(/^\uFEFF/,"");const rows=[];let r=[],c="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}
  else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);rows.push(r);r=[];c=""}else c+=ch}
 if(c!==""||r.length){r.push(c);rows.push(r)}
 return rows.filter(x=>x.some(v=>v.trim()))}
async function fetchText(url){
 const ac=new AbortController(),id=setTimeout(()=>ac.abort(),12000);
 try{const r=await fetch(url,{cache:"no-cache",signal:ac.signal});if(!r.ok)throw new Error("HTTP "+r.status);
  const t=await r.text();if(!t.trim()||/^\s*<(!doctype|html)/i.test(t))throw new Error("not csv");return t}
 finally{clearTimeout(id)}}

function fixImg(u){
 u=String(u||"").trim().replace(/^["'\s]+|["'\s]+$/g,"");if(!u)return"";
 if(u.startsWith("//"))u="https:"+u;
 if(!/^https?:\/\//i.test(u))return"";
 u=https(u);
 const d=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/i);
 if(d)return`https://drive.google.com/thumbnail?id=${d[1]}&sz=w1000`;
 try{return encodeURI(decodeURI(u))}catch{return u.replace(/\s/g,"%20")}}
const splitImgs=s=>String(s||"").split(/\s*(?:\n|\||;)\s*|,\s*(?=https?:\/\/|\/\/)/).map(fixImg).filter(Boolean);

/* ===== CART & SMART ADD ===== */
const saveCart=()=>ls.set("alora_cart",cart);
const cartTotal=()=>cart.reduce((s,i)=>{const p=byId(i.id);return s+(p?eff(p)*i.q:0)},0);

function handleAddToCartDirect(id){
 const p=byId(id);if(!p||p.out)return;
 if(p.sizes && p.sizes.length>0){
  openProduct(id);
 } else {
  addToCart(id,"");
 }
}

function addToCart(id,size){const p=byId(id);if(!p||p.out)return false;
 if(p.sizes.length&&!size)return false;
 const fullSKU = size ? `${id}-${size}` : id;
 const it=cart.find(i=>i.id===id&&(i.size||"")===(size||""));
 it?it.q++:cart.push({id,q:1,size:size||"",sku:fullSKU});
 saveCart();track("AddToCart",p);renderCart();toast(T("toastAdd"));return true}

function renderCart(){
 if(!P.length)return;
 cart=cart.filter(i=>byId(i.id));const n=cart.reduce((s,i)=>s+i.q,0),cc=$("#cc");cc.textContent=n;cc.hidden=!n;
 if(!cart.length){$("#cartBody").innerHTML=`<p class="empty" style="padding:50px 0">${T("emptyCart")}</p>`;$("#cartFoot").innerHTML="";return}
 const gov=ls.get("alora_gov",""),row=govRow(gov),th=row&&row.free?row.free:0,t=cartTotal();
 const bar=th?`<div class="ship">${t<th?T("shipLeft",money(th-t)):T("shipOk")}<div class="track"><i style="width:${Math.min(100,t/th*100)}%"></i></div></div>`:"";
 $("#cartBody").innerHTML=bar+cart.map((i,idx)=>{const p=byId(i.id);return`<div class="ci">${img(p.imgs[0],160,'alt=""')}<div class="t"><b>${esc(p.name)}</b>${i.size?` <small>(${esc(i.size)})</small>`:""}<div>${money(eff(p))}</div>
  <div class="qty"><button data-q="${idx}:-1" aria-label="-">−</button><span>${i.q}</span><button data-q="${idx}:1" aria-label="+">+</button></div>
  <button class="rm" data-rm="${idx}">${T("rm")}</button></div></div>`}).join("");
 const s=ls.get("alora_cust",{}),sc=shipFor(row,t),grand=sc===null?t:t+sc;
 const govSel=SHIP.length?`<select class="in" id="gov"><option value="">${T("govPick")}</option>${SHIP.map(x=>`<option value="${esc(x.gov)}" ${x.gov===gov?"selected":""}>${esc(x.gov)}</option>`).join("")}</select>`:"";
 const shipLine=SHIP.length?`<div class="ship">${row?`${sc===0?T("shipFree"):T("shipCost",money(sc))} · ${T("delivery",esc(row.days))}`:T("govAsk")}</div>${row&&row.free?`<div class="ship">${T("freeNote",row.free)}</div>`:""}`:"";
 $("#cartFoot").innerHTML=`<div class="tot"><span>${T("total")}</span><span>${money(t)}</span></div>${govSel}${shipLine}
  <div class="tot"><span>${T("grand")}</span><span>${money(grand)}</span></div>
  <input class="in" id="cn" placeholder="${T("name")}" autocomplete="name" value="${esc(s.n)}">
  <input class="in" id="cp" placeholder="${T("phone")}" type="tel" inputmode="tel" autocomplete="tel" value="${esc(s.p)}">
  <input class="in" id="ca" placeholder="${T("addr")}" autocomplete="street-address" value="${esc(s.a)}">
  <p class="err" id="err" role="alert"></p><button class="big dark" id="send">${I.wa}${T("send")}</button>`}

function sendOrder(){
 const n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim(),e=$("#err"),gov=ls.get("alora_gov","");
 if(n.split(/\s+/).filter(Boolean).length<2||n.length<5)return e.textContent=T("eName");
 const pd=p.replace(/\D/g,"").replace(/^20/,"0");if(!/^01[0125]\d{8}$/.test(pd))return e.textContent=T("ePhone");
 if(a.length<15||a.split(/\s+/).filter(Boolean).length<4)return e.textContent=T("eAddr");
 if(SHIP.length&&!gov)return e.textContent=T("eGov");
 const wa=waNum();if(!wa)return e.textContent=T("eWa");
 const t=cartTotal(),row=govRow(gov),sc=shipFor(row,t),grand=sc===null?t:t+sc;
 ls.set("alora_cust",{n,p,a});
 const shipTxt=sc===null?T("mTbd"):sc===0?T("mFree"):`${sc} ${T("cur")}`;
 const msg=`🛍 *${T("mNew")} - ${CFG.STORE}*\n\n*${T("mName")}:* ${n}\n*${T("mPhone")}:* ${pd}\n*${T("mGov")}:* ${gov||"-"}\n*${T("mAddr")}:* ${a}\n\n*${T("mItems")}*\n`+
  cart.map((i,k)=>{const x=byId(i.id);const itemSKU=i.size?`${x.id}-${i.size}`:x.id;return`${k+1}) ${x.name} (كود: ${itemSKU})${i.size?` - ${T("mSize")} ${i.size}`:""}\n   ${i.q} × ${eff(x)} = ${eff(x)*i.q} ${T("cur")}`}).join("\n")+
  `\n\n*${T("mTotal")}:* ${t} ${T("cur")}\n*${T("mShip")}:* ${shipTxt}\n*${T("mDelivery")}:* ${row?row.days:"-"}\n*${T("mGrand")}:* ${grand} ${T("cur")}`;
 track("Purchase",{value:grand,ids:cart.map(i=>i.id)});
 const url=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
 cart=[];saveCart();renderCart();closeAll();
 if(!window.open(url,"_blank"))location.href=url}

/* Custom Friendly WhatsApp Inquiry Message */
function askOne(id){const p=byId(id),wa=waNum();if(!p||!wa)return;track("Lead",p);
 const msg=`أهلاً Black & White Alora ✨\nحابّة أسألك عن تفاصيل القطعة دي 💕: ${p.name}${curSize?` (مقاس: ${curSize})`:""}\nكود المنتج: ${curSize?`${p.id}-${curSize}`:p.id}\nالسعر: ${eff(p)} ${T("cur")}\n${location.href.split("#")[0]}`;
 const url=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;if(!window.open(url,"_blank"))location.href=url}

/* ===== MODAL / PRODUCT ===== */
let SCROLLY=0;
function lock(on){$("#ov").classList.toggle("on",on);const b=document.body;
 if(on&&b.style.position!=="fixed"){SCROLLY=window.scrollY;b.style.cssText+=`;position:fixed;top:-${SCROLLY}px;left:0;right:0;width:100%`}
 else if(!on&&b.style.position==="fixed"){b.style.position=b.style.top=b.style.left=b.style.right=b.style.width="";window.scrollTo(0,SCROLLY)}}
function closeAll(){["#cart","#modal","#lb"].forEach(s=>$(s).classList.remove("on"));lock(false)}
function openCart(){closeAll();$("#cart").classList.add("on");lock(true);if(cart.length)track("Checkout",{value:cartTotal(),n:cart.reduce((s,i)=>s+i.q,0),ids:cart.map(i=>i.id)})}
function openProduct(id){const p=byId(id);if(!p)return;curId=id;curSize="";track("ViewContent",p);
 const ims=p.imgs.length?p.imgs:[PH],w=wish.includes(id);lbList=ims;
 const sizes=p.sizes.length?`<div><div class="szt">${T("size")}</div><div class="sizes" id="sizes" role="radiogroup">${p.sizes.map(s=>`<button class="chip" role="radio" aria-checked="false" data-size="${esc(s)}">${esc(s)}</button>`).join("")}</div><div class="szerr" id="szErr" role="alert"></div></div>`:"";
 $("#mIn").innerHTML=`<div class="pm"><div><div class="gal" id="gal">${ims.map((u,i)=>img(u,900,`alt="${esc(altOf(p))}" data-lb="${i}"`)).join("")}</div>
  ${ims.length>1?`<div class="th" id="th">${ims.map((u,i)=>`<button class="${i?"":"on"}" data-th="${i}" aria-label="${i+1}">${img(u,120,'alt=""')}</button>`).join("")}</div>`:""}</div>
  <div class="pi"><span style="font-size:12px;color:var(--mut)">${esc(p.cat)}</span><h2>${esc(p.name)}</h2>${priceHTML(p)}<p>${esc(p.desc)}</p>${sizes}
  <button class="big dark" data-addm="${esc(id)}" ${p.out?"disabled":""}>${p.out?T("out"):T("add")}</button>
  ${p.out?"":`<button class="big soft" data-wa="${esc(id)}">${I.wa}${T("orderWa")}</button>`}
  <button class="big" style="border:1px solid var(--ink)" data-heartm="${esc(id)}">${w?I.heartF:I.heart}${w?T("inWish"):T("addWish")}</button></div></div>`;
 $("#modal").classList.add("on");lock(true);$(".mbox").scrollTop=0;
 const g=$("#gal");if(g)g.onscroll=()=>{const i=Math.round(Math.abs(g.scrollLeft)/(g.clientWidth||1));document.querySelectorAll("#th button").forEach((b,k)=>b.classList.toggle("on",k===i))}}
function pickSize(btn){curSize=btn.dataset.size;document.querySelectorAll("#sizes .chip").forEach(c=>{const on=c===btn;c.classList.toggle("on",on);c.setAttribute("aria-checked",on)});$("#szErr").textContent=""}
function addFromModal(id){const p=byId(id);
 if(p.sizes.length&&!curSize){$("#szErr").textContent=T("needSize");$("#sizes").scrollIntoView({block:"center",behavior:"smooth"});return}
 if(addToCart(id,curSize))closeAll()}
function openLB(i){lbIdx=i;$("#lbI").src=optImg(lbList[i],1400);$("#lb").classList.add("on")}
function toggleWish(id){const on=wish.includes(id);wish=on?wish.filter(x=>x!==id):[...wish,id];ls.set("alora_wish",wish);toast(on?T("toastRm"):T("toastWish"));
 renderReels();renderGrid();const b=document.querySelector(`[data-heartm="${CSS.escape(id)}"]`);if(b)b.innerHTML=(on?I.heart:I.heartF)+(on?T("addWish"):T("inWish"))}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1900)}

/* ===== EVENTS & SCROLL ===== */
window.addEventListener('scroll', () => {
 const header = $('#mainHeader');
 if (header) {
  if (window.scrollY > 40) {
   header.classList.add('scrolled');
  } else {
   header.classList.remove('scrolled');
  }
 }
});

document.addEventListener("contextmenu",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-add-direct],[data-heart],[data-heartm],[data-view],[data-coll],[data-cat],[data-q],[data-rm],[data-close],[data-wa],[data-lb],[data-size],[data-addm],[data-th],#send,#lbN,#lbP,#lbX,#lb");
 if(!t)return;const d=t.dataset;
 if(t.id==="send")return sendOrder();
 if(t.id==="lbN")return openLB((lbIdx+1)%lbList.length);
 if(t.id==="lbP")return openLB((lbIdx-1+lbList.length)%lbList.length);
 if(t.id==="lbX"||t.id==="lb")return $("#lb").classList.remove("on");
 if(d.addDirect!==undefined){e.stopPropagation();handleAddToCartDirect(d.addDirect)}
 else if(d.heart!==undefined||d.heartm!==undefined){e.stopPropagation();toggleWish(d.heart??d.heartm)}
 else if(d.addm!==undefined)addFromModal(d.addm);
 else if(d.size!==undefined)pickSize(t);
 else if(d.th!==undefined){const g=$("#gal");g.scrollTo({left:(LANG==="en"?1:-1)*g.clientWidth*(+d.th),behavior:"smooth"})}
 else if(d.view!==undefined)openProduct(d.view);
 else if(d.coll!==undefined){collRe=COLS.find(x=>x.k===d.coll).re;cat=ALL;wishOnly=false;renderChips();renderGrid();$("#shop").scrollIntoView({behavior:"smooth"})}
 else if(d.cat!==undefined){cat=d.cat;collRe=null;wishOnly=false;renderChips();renderGrid()}
 else if(d.q!==undefined){const[ix,dl]=d.q.split(":"),it=cart[+ix];if(it){it.q+=+dl;if(it.q<1)cart=cart.filter(i=>i!==it);saveCart();renderCart()}}
 else if(d.rm!==undefined){cart=cart.filter((_,ix)=>ix!==+d.rm);saveCart();renderCart()}
 else if(d.wa!==undefined)askOne(d.wa);
 else if(d.lb!==undefined)openLB(+d.lb);
 else if(d.close!==undefined)closeAll()});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){$("#lb").classList.contains("on")?$("#lb").classList.remove("on"):closeAll()}
 if($("#lb").classList.contains("on")){if(e.key==="ArrowLeft")$("#lbN").click();if(e.key==="ArrowRight")$("#lbP").click()}});
$("#ov").onclick=closeAll;
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeAll()});
$("#cartBtn").onclick=openCart;
$("#wishBtn").onclick=()=>{wishOnly=!wishOnly;renderChips();renderGrid();$("#shop").scrollIntoView({behavior:"smooth"})};
$("#langBtn").onclick=()=>{LANG=LANG==="en"?"ar":"en";ls.set("alora_lang",LANG);closeAll();renderAll()};
$("#q").addEventListener("input",e=>{term=e.target.value;renderGrid()});
document.addEventListener("change",e=>{if(e.target.id!=="gov")return;
 const n=$("#cn"),p=$("#cp"),a=$("#ca");
 ls.set("alora_cust",{n:n?n.value:"",p:p?p.value:"",a:a?a.value:""});ls.set("alora_gov",e.target.value);renderCart()});

/* ===== BOOT ===== */
function apply(pT,sT,shT){
 if(sT){const r=parseCSV(sT);if(r.length)S=buildSettings(r)}
 if(pT)P=buildProducts(parseCSV(pT));
 if(shT)SHIP=parseShip(shT);
 applyHead();renderAll()}
(async function boot(){
 const cp=ls.get("alora_csv_p",null),cs=ls.get("alora_csv_s",null),csh=ls.get("alora_csv_ship",null);
 renderAll();if(cp)apply(cp,cs,csh);
 const [rp,rs,rsh]=await Promise.allSettled([fetchText(CFG.PRODUCTS),fetchText(CFG.SETTINGS),fetchText(CFG.SHIP)]);
 const pT=rp.status==="fulfilled"?rp.value:null,sT=rs.status==="fulfilled"?rs.value:null,shT=rsh.status==="fulfilled"?rsh.value:null;
 if(pT)ls.set("alora_csv_p",pT);if(sT)ls.set("alora_csv_s",sT);if(shT)ls.set("alora_csv_ship",shT);
 if(!pT&&!cp){$("#grid").innerHTML=`<div class="empty">${T("fail")} <button style="text-decoration:underline" onclick="location.reload()">${T("retry")}</button></div>`;return}
 apply(pT||cp,sT||cs,shT||csh);
 if(!pT&&cp)toast(T("stale"))})();
</script>
</body>
</html>
