 document.head.appendChild(s)})}

 if(gid&&/^[\w-]+$/.test(gid)){const s=document.createElement("script");s.async=true;s.src="https://www.googletagmanager.com/gtag/js?id="+gid;document.head.appendChild(s);window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag("js",new Date());gtag("config",gid)}
 if(os){const s=document.createElement("script");s.src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";s.defer=true;document.head.appendChild(s);window.OneSignalDeferred=window.OneSignalDeferred||[];OneSignalDeferred.push(async O=>{try{await O.init({appId:os})}catch(e){console.warn(e)}})}
 track("PageView")}
function track(ev,d={}){try{const v=d.value??eff(d)??0,ids=[d.cid||d.id],C="EGP";
 if(window.fbq){
  if(ev==="PageView")fbq("track","PageView");
  else if(ev==="ViewContent"||ev==="AddToCart"||ev==="Lead")fbq("track",ev==="Lead"?"Lead":ev,{content_ids:ids,content_name:d.name,content_type:"product",value:v,currency:C});
  else if(ev==="Checkout")fbq("track","InitiateCheckout",{value:v,num_items:d.n,currency:C});
  else if(ev==="Purchase"){fbq("track","Lead",{value:v,currency:C});fbq("track","Purchase",{value:v,currency:C,content_ids:d.ids,content_type:"product"})}}
 if(window.gtag){const it=d.name?[{item_id:ids[0],item_name:d.name,price:v}]:undefined;
  if(ev==="PageView")gtag("event","page_view");
  else if(ev==="ViewContent")gtag("event","view_item",{currency:C,value:v,items:it});
  else if(ev==="AddToCart")gtag("event","add_to_cart",{currency:C,value:v,items:it});
  else if(ev==="Lead")gtag("event","generate_lead",{currency:C,value:v});
  else if(ev==="Checkout")gtag("event","begin_checkout",{currency:C,value:v});
  else if(ev==="Purchase"){gtag("event","generate_lead",{currency:C,value:v});gtag("event","purchase",{transaction_id:"WA-"+Date.now(),currency:C,value:v})}}
 const hook=CFG.WEBHOOK||sv("Webhook_URL");
 if(hook&&ev!=="PageView")fetch(hook,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({event:ev,store:CFG.STORE,ts:new Date().toISOString(),page:location.href,data:d,text:"🔔 "+ev+"\n"+JSON.stringify(d).slice(0,1500)})}).catch(()=>{});
}catch(e){console.warn("track",e)}}

/* ======================= RENDER ======================= */
function waNum(){let n=(sv("Store_Phone_WhatsApp")||CFG.WA).replace(/\D/g,"");if(n.startsWith("00"))return n.slice(2);return n.startsWith("0")?CFG.CC+n.slice(1):n}
function applyLang(){
 document.documentElement.lang=LANG;document.documentElement.dir=LANG==="en"?"ltr":"rtl";
 document.title=LANG==="en"?"Black & White Alora | Luxury Bags & Accessories":"Black & White Alora | شنط وإكسسوارات فاخرة";
 $("#langBtn").textContent=LANG==="en"?"عربي":"EN";
 $("#heroBtn").textContent=T("shopNow");$("#tBest").textContent=T("best");$("#tSwipe").textContent=T("swipe");
 $("#tCols").textContent=T("cols");$("#tInfo").textContent=T("info");$("#tContact").textContent=T("contact");
 $("#tCart").textContent=T("cart");$("#aboutLink").textContent=ptitle("aboutustext");$("#q").placeholder=T("search");$("#brandP").textContent=T("brandP");

}
function applyHero(){const ar=LANG!=="en";
 $("#heroT").textContent=(ar?sv("Hero_Title"):sv("Hero_Title_EN"))||T("heroH");

 /* footer line: from Site_Settings > Footer_Text; empty or missing = the code default */

function renderAnn(){const a=sv("Announcement_Text"),e=$("#ann");if(a){e.textContent=a;e.hidden=false}else e.hidden=true}
function renderNav(){
 const pols=policyKeys();
 $("#nav").innerHTML=`<a href="#best">${T("navBest")}</a><a href="#cols">${T("navCols")}</a><a href="#shop">${T("navShop")}</a>`+
  ""}
/* social link: found by key (EN/AR names) or, failing that, by the domain of the link itself */
const SOC={facebook:{keys:["Facebook_URL","Facebook","فيس بوك","فيسبوك"],re:/facebook\.com|fb\.com|fb\.me/i},
 instagram:{keys:["Instagram_URL","Instagram","انستجرام","انستغرام","انستقرام"],re:/instagram\.com|instagr\.am/i},
 tiktok:{keys:["TikTok_URL","TikTok","تيك توك","تيكتوك"],re:/tiktok\.com/i}};
function findSocial(k){const v=sv(...SOC[k].keys);if(v)return v;

function renderFooter(){
 $("#fpol").innerHTML=policyKeys().filter(k=>k!=="aboutustext").map(k=>`<button class="flink" data-pol="${esc(k)}">${esc(ptitle(k))}</button>`).join("");
 $("#aboutLink").hidden=!sv("About_Us_Text");
 const href=v=>!v?"#":/^https?:\/\//i.test(v)?v:"https://"+v.replace(/^\/+/,"");
 const soc=[[href(findSocial("facebook")),I.fb,"Facebook"],[href(findSocial("instagram")),I.ig,"Instagram"],[href(findSocial("tiktok")),I.tt,"TikTok"]];
 const em=(sv("Store_Email","Email")||CFG.EMAIL).replace(/^mailto:/i,"");
 $("#soc").innerHTML=soc.map(([u,ic,lb])=>`<a href="${esc(u)}" target="_blank" rel="noopener" aria-label="${lb}">${ic}</a>`).join("")+
  `<a href="mailto:${esc(em)}" aria-label="Email">${I.mail}</a><a href="https://wa.me/${waNum()}" target="_blank" rel="noopener" aria-label="WhatsApp">${I.wa}</a>`;
 $("#copyLine").textContent=`© ${new Date().getFullYear()} — ${LANG==="en"?"All rights reserved":"جميع الحقوق محفوظة"}`;
 const fab=$("#waFab");fab.href="https://wa.me/"+waNum();fab.hidden=false}
const altOf=p=>p.alt||(p.desc?`${p.name} - ${p.desc.slice(0,90)}`:p.name);
function freeNoteHTML(){const row=govRow(ls.get("alora_gov",""));return row&&row.free?`<div class="ship">${T("freeNote",row.free)}</div>`:""}
function priceHTML(p){return`<div class="price"><b>${money(eff(p))}</b>${p.sale?`<s>${money(p.price)}</s>`:""}</div>`}
function cardHTML(p,cls){const w=wish.includes(p.id),off=p.sale?Math.round((1-p.sale/p.price)*100):0;
 return`<article class="${cls}"><div class="im" data-view="${esc(p.id)}">${img(p.imgs[0],560,`alt="${esc(altOf(p))}"`)}${off?`<span class="badge">-${off}%</span>`:""}
 <button class="fav ${w?"on":""}" data-heart="${esc(p.id)}" aria-label="${T("wish")}">${w?I.heartF:I.heart}</button></div>
 <div class="bd"><h3 data-view="${esc(p.id)}">${esc(p.name)}</h3>${priceHTML(p)}
 <button class="add" data-add="${esc(p.id)}" ${p.out?"disabled":""}>${p.out?T("out"):T("add")}</button></div></article>`}
function renderReels(){
 let L=P.filter(p=>p.best).sort((a,b)=>(b.ts-a.ts)||(b.ord-a.ord));
 if(!L.length)L=P.filter(p=>p.featured);
 if(!L.length)L=P.slice(0,6);
 L=L.slice(0,10);
 $("#reels").innerHTML=L.length?L.map(p=>cardHTML(p,"reel")).join(""):"";
 $("#dots").innerHTML=L.length>1?L.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join(""):"";
 const r=$("#reels");r.onscroll=()=>{const w=(r.children[0]?.offsetWidth||1)+10,i=Math.round(Math.abs(r.scrollLeft)/w);[...$("#dots").children].forEach((d,k)=>d.classList.toggle("on",k===i))}}
function renderCols(){
 $("#colGrid").innerHTML=COLS.map(c=>`<button class="col" data-coll="${c.k}">${img(fixImg(sv(c.key))||c.fb,600,'alt=""')}<span>${LANG==="en"?c.en:c.ar}</span></button>`).join("")}
function renderChips(){
 const cats=[ALL,...new Set(P.map(p=>p.cat))];
 $("#chips").innerHTML=cats.map(c=>`<button class="chip ${c===cat&&!wishOnly?"on":""}" data-cat="${esc(c)}">${c===ALL?T("all"):esc(c)}</button>`).join("")}
function renderGrid(){
 const L=P.filter(p=>{if(wishOnly)return wish.includes(p.id);
  if(cat!==ALL&&p.cat!==cat)return false;if(collRe&&!collRe.test(p.cat))return false;
  if(term&&!norm(p.name+p.cat+p.desc+p.id).includes(norm(term)))return false;return true});
 $("#grid").innerHTML=L.length?L.map(p=>cardHTML(p,"card")).join(""):`<div class="empty">${wishOnly?T("emptyWish"):T("emptyCat")}</div>`;

function renderAll(){applyLang();applyHero();renderAnn();renderNav();renderFooter();renderReels();renderCols();renderChips();renderGrid();renderCart()}

/* ======================= CART ======================= */
const saveCart=()=>ls.set("alora_cart",cart);
const cartTotal=()=>cart.reduce((s,i)=>{const p=byId(i.id);return s+(p?eff(p)*i.q:0)},0);
function addToCart(id){const p=byId(id);if(!p||p.out)return;const it=cart.find(i=>i.id===id);it?it.q++:cart.push({id,q:1});saveCart();track("AddToCart",p);renderCart();toast(T("toastAdd"))}
function renderCart(){
 cart=cart.filter(i=>byId(i.id));const n=cart.reduce((s,i)=>s+i.q,0),cc=$("#cc");cc.textContent=n;cc.hidden=!n;
 if(!cart.length){$("#cartBody").innerHTML=`<p class="empty" style="padding:50px 0">${T("emptyCart")}</p>`;$("#cartFoot").innerHTML="";return}
 const row0=govRow(ls.get("alora_gov","")),th=row0&&row0.free?row0.free:0,t=cartTotal();
 const bar=th?`<div class="ship">${t<th?T("shipLeft",money(th-t)):T("shipOk")}<div class="track"><i style="width:${Math.min(100,t/th*100)}%"></i></div></div>`:"";
 $("#cartBody").innerHTML=bar+cart.map(i=>{const p=byId(i.id);return`<div class="ci">${img(p.imgs[0],160,`alt=""`)}<div class="t"><b>${esc(p.name)}</b><div>${money(eff(p))}</div>
  <div class="qty"><button data-q="${esc(i.id)}:-1" aria-label="-">−</button><span>${i.q}</span><button data-q="${esc(i.id)}:1" aria-label="+">+</button></div>
  <button class="rm" data-rm="${esc(i.id)}">${T("rm")}</button></div></div>`}).join("");
 const s=ls.get("alora_cust",{}),gov=ls.get("alora_gov","");
 const row=govRow(gov),sc=shipFor(row,t),grand=sc===null?t:t+sc;
 const govSel=SHIP.length?`<select class="in" id="gov"><option value="">${T("govPick")}</option>${SHIP.map(x=>`<option value="${esc(x.gov)}" ${x.gov===gov?"selected":""}>${esc(x.gov)}</option>`).join("")}</select>`:"";
 const shipLine=SHIP.length?`<div class="ship">${row?`${sc===0?T("shipFree"):T("shipCost",money(sc))} · ${T("delivery",esc(row.days))}`:T("govAsk")}</div>${row&&row.free?`<div class="ship">${T("freeNote",row.free)}</div>`:""}`:"";
 $("#cartFoot").innerHTML=`<div class="tot"><span>${T("total")}</span><span>${money(t)}</span></div>
  ${govSel}${shipLine}
  <div class="tot"><span>${T("grand")}</span><span>${money(grand)}</span></div>
  <input class="in" id="cn" placeholder="${T("name")}" autocomplete="name" value="${esc(s.n)}">
  <input class="in" id="cp" placeholder="${T("phone")}" type="tel" inputmode="tel" autocomplete="tel" value="${esc(s.p)}">
  <input class="in" id="ca" placeholder="${T("addr")}" autocomplete="street-address" value="${esc(s.a)}">
  <p class="err" id="err" role="alert"></p>
  <button class="big dark" id="send">${I.wa}${T("send")}</button>`;
 track("Checkout",{value:grand,n})}
function sendOrder(){
 const n=$("#cn").value.trim(),p=$("#cp").value.trim(),a=$("#ca").value.trim(),e=$("#err");
 const gov=ls.get("alora_gov","");
 if(n.split(/\s+/).filter(Boolean).length<2||n.length<5)return e.textContent=T("eName");
 const pd=p.replace(/\D/g,"").replace(/^20/,"0");if(!/^01[0125]\d{8}$/.test(pd))return e.textContent=T("ePhone");
 if(a.length<15||a.split(/\s+/).filter(Boolean).length<4)return e.textContent=T("eAddr");
 if(SHIP.length&&!gov)return e.textContent=T("eGov");
 const wa=waNum();if(!wa)return e.textContent=T("eWa");
 const t=cartTotal(),row=govRow(gov),sc=shipFor(row,t),grand=sc===null?t:t+sc;
 ls.set("alora_cust",{n,p,a});
 const shipTxt=sc===null?T("mTbd"):sc===0?T("mFree"):`${sc} ${T("cur")}`;
 const msg=`🛍 *${T("mNew")} - ${CFG.STORE}*\n\n*${T("mName")}:* ${n}\n*${T("mPhone")}:* ${p}\n*${T("mGov")}:* ${gov||"-"}\n*${T("mAddr")}:* ${a}\n\n*${T("mItems")}*\n`+
  cart.map((i,k)=>{const x=byId(i.id);return`${k+1}) ${x.name} (${x.id})\n   ${i.q} × ${eff(x)} = ${eff(x)*i.q} ${T("cur")}`}).join("\n")+
  `\n\n*${T("mTotal")}:* ${t} ${T("cur")}\n*${T("mShip")}:* ${shipTxt}\n*${T("mDelivery")}:* ${row?row.days:"-"}\n*${T("mGrand")}:* ${grand} ${T("cur")}`;
 track("Purchase",{value:grand,ids:cart.map(i=>byId(i.id).cid)});
 const url=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
 cart=[];saveCart();renderCart();closeAll();
 if(!window.open(url,"_blank"))location.href=url}
function orderOne(id){const p=byId(id),wa=waNum();if(!p||p.out||!wa)return;track("Lead",p);
 const msg=`🛍 ${T("mOne")}\n*${p.name}*\n${T("mCode")}: ${p.id}\n${T("mPrice")}: ${eff(p)} ${T("cur")}\n${location.href.split("#")[0]}`;
 const url=`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;if(!window.open(url,"_blank"))location.href=url}

/* ======================= MODALS ======================= */
function lock(on){$("#ov").classList.toggle("on",on);document.body.style.overflow=on?"hidden":""}
function closeAll(){$("#cart").classList.remove("on");$("#modal").classList.remove("on");$("#lb").classList.remove("on");lock(false)}
function openCart(){closeAll();$("#cart").classList.add("on");lock(true)}
function openModal(html){$("#mIn").innerHTML=html;$("#modal").classList.add("on");lock(true)}
function openProduct(id,quiet){const p=byId(id);if(!p)return;curId=id;if(!quiet)track("ViewContent",p);
 const ims=p.imgs.length?p.imgs:[PH];lbList=ims;const w=wish.includes(id);
 openModal(`<div class="pm"><div><div class="gal" id="gal">${ims.map((u,i)=>img(u,800,`alt="${esc(altOf(p))}" data-lb="${i}"`)).join("")}</div></div>
  <div class="pi"><span style="font-size:12px;color:var(--mut)">${esc(p.cat)}</span><h2>${esc(p.name)}</h2>${priceHTML(p)}${freeNoteHTML()}
  <p>${esc(p.desc)}</p>
  <button class="big dark" data-add="${esc(id)}" ${p.out?"disabled":""}>${p.out?T("out"):T("add")}</button>
  ${p.out?"":`<button class="big soft" data-wa="${esc(id)}">${I.wa}${T("orderWa")}</button>`}
  <button class="big" style="border:1px solid var(--ink)" data-heart="${esc(id)}">${w?I.heartF:I.heart}${w?T("inWish"):T("addWish")}</button>
 </div></div>`)}
function bi(t){t=String(t||"");if(!/\[(AR|EN)\]/i.test(t))return t.trim();
 const m=t.split(/\[(AR|EN)\]/i),out={};
 for(let i=1;i<m.length;i+=2){const k=m[i].toUpperCase();out[k]=(out[k]||"")+m[i+1]}
 return (out[LANG==="en"?"EN":"AR"]||out.AR||out.EN||"").trim()}
function openPol(k){openModal(`<div class="pol"><h2>${esc(ptitle(k))}</h2><p>${esc(bi(sv(k))||T("soon"))}</p></div>`)}
function openLB(i){lbIdx=i;$("#lbI").src=optImg(lbList[i],1200);$("#lb").classList.add("on")}
function toggleWish(id){const on=wish.includes(id);wish=on?wish.filter(x=>x!==id):[...wish,id];ls.set("alora_wish",wish);
 const p=byId(id);hook("WishlistToggle",{id,name:p?.name,added:!on});toast(on?T("toastRm"):T("toastWish"));
 renderReels();renderGrid();if($("#modal").classList.contains("on")&&curId===id)openProduct(id,true)}
function hook(ev,d){const u=CFG.WEBHOOK||sv("Webhook_URL");if(!u)return;
 fetch(u,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:JSON.stringify({event:ev,store:CFG.STORE,ts:new Date().toISOString(),page:location.href,data:d,text:"🔔 "+ev+"\n"+JSON.stringify(d).slice(0,1500)})}).catch(()=>{})}
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1900)}

/* ======================= EVENTS ======================= */
document.addEventListener("contextmenu",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.addEventListener("dragstart",e=>{if(e.target.tagName==="IMG")e.preventDefault()});
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-add],[data-heart],[data-view],[data-coll],[data-cat],[data-q],[data-rm],[data-close],[data-pol],[data-wa],[data-lb],[data-dot],#send,#lbN,#lbP,#lbX,#lb");
 if(!t)return;const d=t.dataset;
 if(t.id==="send"){sendOrder();return}
 if(t.id==="lbN"){openLB((lbIdx+1)%lbList.length);return}
 if(t.id==="lbP"){openLB((lbIdx-1+lbList.length)%lbList.length);return}
 if(t.id==="lbX"||t.id==="lb"){$("#lb").classList.remove("on");return}
 if(d.add!==undefined){e.stopPropagation();addToCart(d.add)}
 else if(d.heart!==undefined){e.stopPropagation();toggleWish(d.heart)}
 else if(d.view!==undefined)openProduct(d.view);
 else if(d.coll!==undefined){const c=COLS.find(x=>x.k===d.coll);collRe=c.re;cat=ALL;wishOnly=false;renderChips();renderGrid();$("#shop").scrollIntoView({behavior:"smooth"})}
 else if(d.cat!==undefined){cat=d.cat;collRe=null;wishOnly=false;renderChips();renderGrid()}
 else if(d.q!==undefined){const[id,dl]=d.q.split(":"),it=cart.find(i=>i.id===id);if(it){it.q+=+dl;if(it.q<1)cart=cart.filter(i=>i!==it);saveCart();renderCart()}}
 else if(d.rm!==undefined){cart=cart.filter(i=>i.id!==d.rm);saveCart();renderCart()}
 else if(d.pol!==undefined){e.preventDefault();openPol(d.pol)}
 else if(d.wa!==undefined)orderOne(d.wa);
 else if(d.lb!==undefined)openLB(+d.lb);
 else if(d.close!==undefined)closeAll();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#lb").classList.contains("on")?$("#lb").classList.remove("on"):closeAll()}
 if($("#lb").classList.contains("on")){if(e.key==="ArrowLeft")$("#lbN").click();if(e.key==="ArrowRight")$("#lbP").click()}});
$("#ov").onclick=closeAll;
function togglePol(){const b=$("#fpol"),t=$("#tInfo");b.hidden=!b.hidden;t.classList.toggle("open",!b.hidden)}
document.addEventListener("click",e=>{if(e.target.closest("#tInfo"))togglePol()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="tInfo")togglePol()});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeAll()});
$("#cartBtn").onclick=openCart;
$("#wishBtn").onclick=()=>{wishOnly=!wishOnly;renderChips();renderGrid();$("#shop").scrollIntoView({behavior:"smooth"})};
$("#langBtn").onclick=()=>{LANG=LANG==="en"?"ar":"en";ls.set("alora_lang",LANG);closeAll();renderAll()};
$("#q").addEventListener("input",e=>{term=e.target.value;renderGrid()});
document.addEventListener("change",e=>{if(e.target.id!=="gov")return;
 const n=$("#cn"),p=$("#cp"),a=$("#ca");
 ls.set("alora_cust",{n:n?n.value:"",p:p?p.value:"",a:a?a.value:""});
 ls.set("alora_gov",e.target.value);renderCart()});

/* ======================= BOOT (show cache instantly, then refresh) ======================= */
function applySheets(pText,sText,shText){
 if(sText){const rows=parseCSV(sText);if(rows.length)S=buildSettings(rows)}
 if(pText){P=buildProducts(parseCSV(pText))}
 if(shText)SHIP=parseShip(shText);
 applyHead();renderAll();initAnalytics()}
(async function boot(){
 const cp=ls.get("alora_csv_p",null),cs=ls.get("alora_csv_s",null),csh=ls.get("alora_csv_ship",null);
 renderAll();
 if(cp||cs||csh){applySheets(cp,cs,csh)}
 const [rp,rs,rsh]=await Promise.allSettled([fetchText(CFG.PRODUCTS_URL),fetchText(CFG.SETTINGS_URL),fetchText(CFG.SHIP_URL)]);
 let shText=rsh.status==="fulfilled"?rsh.value:null;
 /* decide which tab is products by its headers, whatever the gid order */
 let pText=rp.status==="fulfilled"?rp.value:null,sText=rs.status==="fulfilled"?rs.value:null;
 const isProd=t=>{const h=(parseCSV(t)[0]||[]).map(norm);return h.includes("price")&&(h.includes("name")||h.includes("title"))};
 if(pText&&!isProd(pText)&&sText&&isProd(sText)){[pText,sText]=[sText,pText]}
 if(pText&&isProd(pText)){ls.set("alora_csv_p",pText)}else pText=null;
 if(sText)ls.set("alora_csv_s",sText);
 if(shText)ls.set("alora_csv_ship",shText);
 if(!pText&&!cp){$("#grid").innerHTML=`<div class="empty">${T("fail")} <button style="text-decoration:underline" onclick="location.reload()">${T("retry")}</button></div>`;return}
 if(pText||sText||shText)applySheets(pText||cp,sText||cs,shText||csh);
 if(!pText&&cp)toast(T("stale"))
})();
</script>
